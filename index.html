<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Thiệp Sự Kiện 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body {
            margin: 0; padding: 10px; font-family: 'Arial', sans-serif;
            background: #1a1a2e; color: #fff; display: flex; justify-content: center;
        }
        .container {
            background: #fff; color: #333; padding: 20px;
            border-radius: 15px; max-width: 400px; width: 100%; text-align: center;
        }
        
        /* KHU VỰC LIVE PREVIEW */
        .preview-wrapper {
            position: relative;
            width: 100%;
            margin: 15px 0;
            display: none;
        }
        #phoi-bg { width: 100%; display: block; border-radius: 10px; }
        
        .cropper-box {
            position: absolute;
            top: 25%; /* Căn chỉnh để khớp với hình tròn đen của phôi */
            left: 63.5%; 
            width: 32%; /* Tỉ lệ kích thước hình tròn */
            aspect-ratio: 1/1;
            transform: translateX(-50%);
            z-index: 5;
            border-radius: 50%; /* Tạo khung tròn cho ảnh preview */
            overflow: hidden;
            border: 2px solid gold;
        }
        
        .img-container { width: 100%; height: 100%; }
        
        /* Tinh chỉnh Cropper */
        .cropper-view-box, .cropper-face { border-radius: 50%; }
        .cropper-modal { background-color: rgba(0,0,0,0.1) !important; }

        input[type="text"] {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 2px solid #2d5a27; border-radius: 8px; text-align: center;
        }
        .btn {
            background: #2d5a27; color: white; border: none;
            padding: 12px; width: 100%; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
        canvas { width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h3 style="color: #2d5a27;">HỆ THỐNG TẠO THIỆP</h3>
        <input type="file" id="imageInput" accept="image/*">

        <div class="preview-wrapper" id="previewWrapper">
            <img id="phoi-bg" src="phoi-thiep.jpg">
            <div class="cropper-box">
                <div class="img-container"><img id="imageToCrop"></div>
            </div>
        </div>

        <input type="text" id="userName" placeholder="NHẬP HỌ TÊN CỦA BẠN">
        <button class="btn" id="generateBtn">TẠO THIỆP & TẢI VỀ</button>
        <canvas id="mainCanvas"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const imageInput = document.getElementById('imageInput');
        const imageToCrop = document.getElementById('imageToCrop');
        const generateBtn = document.getElementById('generateBtn');
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        let cropper;

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imageToCrop.src = event.target.result;
                    document.getElementById('previewWrapper').style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                        dragMode: 'move',
                        guides: false,
                        center: false,
                        highlight: false,
                        cropBoxMovable: false,
                        cropBoxResizable: false,
                        toggleDragModeOnDblclick: false,
                    });
                };
                reader.readAsDataURL(file);
            }
        };

        generateBtn.onclick = () => {
            const name = document.getElementById('userName').value;
            if (!name || !cropper) return alert("Vui lòng chọn ảnh và nhập tên!");

            const template = new Image();
            template.crossOrigin = "anonymous";
            template.src = 'phoi-thiep.jpg';

            template.onload = () => {
                mainCanvas.width = template.width;
                mainCanvas.height = template.height;
                
                // 1. Vẽ phôi thiệp
                ctx.drawImage(template, 0, 0);

                // 2. Cắt ảnh cá nhân thành hình tròn
                const croppedCanvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
                
                ctx.save();
                ctx.beginPath();
                // Vẽ một hình tròn mặt nạ (x, y, radius)
                // Căn chỉnh tọa độ x, y để khớp với vòng tròn vàng trên phôi
                const circleX = 760; // Tọa độ ngang trung tâm hình tròn đen
                const circleY = 405; // Tọa độ dọc trung tâm hình tròn đen
                const radius = 188;  // Bán kính hình tròn
                
                ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip(); // Cắt theo hình tròn đã vẽ

                // Vẽ ảnh cá nhân vào vị trí đã clip
                ctx.drawImage(croppedCanvas, circleX - radius, circleY - radius, radius * 2, radius * 2);
                ctx.restore();

                // 3. Viết tên vào Ô ĐỎ
                ctx.font = "bold 45px Arial";
                ctx.fillStyle = "white"; // Chỉnh màu chữ cho nổi bật trên nền xanh
                ctx.textAlign = "center";
                // Tọa độ 760 là cột bên phải, 640 là chiều cao ô đỏ
                ctx.fillText(name.toUpperCase(), 760, 640);

                // 4. Hiển thị và Tải về
                mainCanvas.style.display = 'block';
                const link = document.createElement('a');
                link.download = 'thiep-moi-2026.png';
                link.href = mainCanvas.toDataURL('image/png');
                link.click();
            };
        };
    </script>
</body>
</html>
