<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duyên Thị - Tạo Thiệp Mời</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: #004d25; /* Màu xanh chủ đạo Duyên Thị */
            display: flex; justify-content: center;
            overflow-x: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 500px; /* Độ rộng tối đa cho mobile */
            position: relative;
            background: #fff;
            min-height: 100vh;
        }
        /* Phôi thiệp nền tràn màn hình */
        .card-wrapper {
            position: relative;
            width: 100%;
        }
        #phoi-bg {
            width: 100%;
            display: block;
        }
        /* Khung chứa ảnh người dùng - Nằm đè lên phôi */
        .photo-slot {
            position: absolute;
            top: 26.2%; /* Tọa độ khớp với vòng tròn vàng */
            left: 50%;
            width: 41%; /* Độ rộng vòng tròn */
            aspect-ratio: 1/1;
            transform: translateX(33%); /* Đẩy sang phải để khớp vòng tròn đen */
            z-index: 5;
            border-radius: 50%;
            overflow: hidden;
        }
        .cropper-container { background: transparent !important; }
        .cropper-modal { opacity: 0.1 !important; }

        /* Form nhập liệu nằm dưới cùng hoặc nổi lên trên */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0; width: 100%;
            padding: 0 20px;
            z-index: 100;
        }
        input[type="text"] {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border: 2px solid #ffcc00; border-radius: 25px;
            text-align: center; font-weight: bold; outline: none;
        }
        .btn-upload {
            background: #ffcc00; color: #004d25;
            padding: 12px; border-radius: 25px;
            display: block; text-align: center;
            font-weight: bold; cursor: pointer; margin-bottom: 10px;
        }
        .btn-generate {
            background: #fff; color: #004d25;
            border: 2px solid #004d25; padding: 12px;
            width: 100%; border-radius: 25px;
            font-weight: bold; cursor: pointer;
        }
        #mainCanvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card-wrapper">
        <!-- Ảnh phôi thiệp -->
        <img id="phoi-bg" src="phoi-thiep.png" alt="Phôi Thiệp">
        
        <!-- Vòng tròn để người dùng di chuyển ảnh trực tiếp trên thiệp -->
        <div class="photo-slot" id="slot">
            <img id="imageToCrop" src="" style="display: none;">
        </div>
    </div>

    <div class="controls">
        <label class="btn-upload">
            BƯỚC 1: CHỌN ẢNH CỦA BẠN
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </label>
        
        <input type="text" id="userName" placeholder="BƯỚC 2: NHẬP TÊN CỦA BẠN">
        
        <button class="btn-generate" id="generateBtn">BƯỚC 3: TẠO & TẢI THIỆP</button>
    </div>

    <canvas id="mainCanvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    const imageInput = document.getElementById('imageInput');
    const imageToCrop = document.getElementById('imageToCrop');
    const generateBtn = document.getElementById('generateBtn');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    let cropper;

    // Khi chọn ảnh
    imageInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                imageToCrop.src = event.target.result;
                imageToCrop.style.display = 'block';
                if (cropper) cropper.destroy();
                
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    guides: false,
                    center: false,
                    highlight: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                    autoCropArea: 1,
                    toggleDragModeOnDblclick: false,
                });
            };
            reader.readAsDataURL(file);
        }
    };

    // Khi nhấn Tạo thiệp
    generateBtn.onclick = () => {
        const name = document.getElementById('userName').value;
        if (!name || !cropper) return alert("Vui lòng chọn ảnh và nhập tên!");

        const template = new Image();
        template.crossOrigin = "anonymous";
        template.src = 'phoi-thiep.jpg';

        template.onload = () => {
            // Kích thước chuẩn của phôi
            mainCanvas.width = template.width;
            mainCanvas.height = template.height;
            
            // 1. Vẽ phôi
            ctx.drawImage(template, 0, 0);

            // 2. Vẽ ảnh đại diện (Hình tròn)
            const croppedCanvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
            
            ctx.save();
            ctx.beginPath();
            // Căn tọa độ X, Y chuẩn theo phôi gốc (Tỉ lệ 1000x1000)
            const circleX = 765; 
            const circleY = 405; 
            const radius = 195; 
            
            ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(croppedCanvas, circleX - radius, circleY - radius, radius * 2, radius * 2);
            ctx.restore();

            // 3. Viết tên vào ô đỏ
            ctx.font = "bold 45px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText(name.toUpperCase(), 765, 642);

            // 4. Tải về
            const link = document.createElement('a');
            link.download = 'thiep-duyen-thi.png';
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        };
        
        template.onerror = () => alert("Không tìm thấy file phoi-thiep.jpg! Hãy kiểm tra lại tên file.");
    };
</script>

</body>
</html>
