<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duyên Thị - Tạo Thiệp Mời</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: #004d25;
            display: flex; justify-content: center;
            overflow-x: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            background: #fff;
            min-height: 100vh;
        }
        .card-wrapper {
            position: relative;
            width: 100%;
        }
        #phoi-bg {
            width: 100%;
            display: block;
        }
        /* CĂN CHỈNH VÒNG TRÒN PREVIEW */
        .photo-slot {
            position: absolute;
            top: 25.5%; /* Tọa độ dọc */
            left: 76.5%; /* Tọa độ ngang */
            width: 31%;  /* ĐÃ THU NHỎ để khớp vòng vàng */
            aspect-ratio: 1/1;
            transform: translate(-50%, 0);
            z-index: 5;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #ffcc00; /* Viền chỉ dẫn nhẹ */
        }
        .cropper-container { background: transparent !important; }
        .cropper-modal { opacity: 0.1 !important; }

        .controls {
            position: relative;
            padding: 20px;
            z-index: 100;
            background: #fff;
        }
        input[type="text"] {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border: 2px solid #ffcc00; border-radius: 25px;
            text-align: center; font-weight: bold; outline: none;
        }
        .btn-upload {
            background: #ffcc00; color: #004d25;
            padding: 12px; border-radius: 25px;
            display: block; text-align: center;
            font-weight: bold; cursor: pointer; margin-bottom: 10px;
        }
        .btn-generate {
            background: #004d25; color: #fff;
            border: none; padding: 15px;
            width: 100%; border-radius: 25px;
            font-weight: bold; cursor: pointer;
            font-size: 16px;
        }
        #mainCanvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card-wrapper">
        <img id="phoi-bg" src="phoi-thiep.png" alt="Phôi Thiệp">
        <div class="photo-slot" id="slot">
            <img id="imageToCrop" src="" style="display: none;">
        </div>
    </div>

    <div class="controls">
        <label class="btn-upload">
            BƯỚC 1: CHỌN ẢNH CỦA BẠN
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </label>
        <input type="text" id="userName" placeholder="BƯỚC 2: NHẬP TÊN CỦA BẠN">
        <button class="btn-generate" id="generateBtn">BƯỚC 3: TẠO & TẢI THIỆP</button>
    </div>

    <canvas id="mainCanvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    const imageInput = document.getElementById('imageInput');
    const imageToCrop = document.getElementById('imageToCrop');
    const generateBtn = document.getElementById('generateBtn');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    let cropper;

    imageInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                imageToCrop.src = event.target.result;
                imageToCrop.style.display = 'block';
                if (cropper) cropper.destroy();
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    guides: false,
                    center: false,
                    highlight: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                    autoCropArea: 1,
                });
            };
            reader.readAsDataURL(file);
        }
    };

    generateBtn.onclick = () => {
        const name = document.getElementById('userName').value;
        if (!name || !cropper) return alert("Vui lòng chọn ảnh và nhập tên!");

        const template = new Image();
        template.crossOrigin = "anonymous";
        template.src = 'phoi-thiep.png';

        template.onload = () => {
            mainCanvas.width = template.width;
            mainCanvas.height = template.height;
            
            ctx.drawImage(template, 0, 0);

            // CẮT ẢNH TRÒN VỚI TỌA ĐỘ CHUẨN TRÊN PHÔI 1000px
            const croppedCanvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
            
            ctx.save();
            ctx.beginPath();
            const circleX = 765; // Tâm ngang
            const circleY = 405; // Tâm dọc
            const radius = 155;  // ĐÃ THU NHỎ BÁN KÍNH ĐỂ VỪA VÒNG VÀNG
            
            ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(croppedCanvas, circleX - radius, circleY - radius, radius * 2, radius * 2);
            ctx.restore();

            // VIẾT TÊN VÀO Ô ĐỎ
            ctx.font = "bold 45px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText(name.toUpperCase(), 765, 642);

            const link = document.createElement('a');
            link.download = 'thiep-duyen-thi.png';
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        };
    };
</script>
</body>
</html>
