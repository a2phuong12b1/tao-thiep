<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tạo Thiệp Tự Động</title>
    <!-- Thư viện cắt ảnh -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>TẠO THIỆP MỜI</h1>
        <p>Vui lòng tải ảnh và nhập tên để nhận thiệp</p>

        <div class="input-section">
            <label class="custom-file-upload">
                <input type="file" id="imageInput" accept="image/*">
                Chọn ảnh cá nhân
            </label>
            
            <div id="cropArea" style="display:none;">
                <div class="img-container">
                    <img id="imageToCrop">
                </div>
                <button id="cropButton">Xác nhận cắt ảnh</button>
            </div>

            <input type="text" id="userName" placeholder="NHẬP HỌ TÊN CỦA BẠN" autocomplete="off">
            <button id="generateBtn">TẠO THIỆP NGAY</button>
        </div>

        <div id="resultArea" style="display:none;">
            <h3>Kết quả của bạn:</h3>
            <canvas id="mainCanvas"></canvas>
            <button id="downloadBtn">TẢI THIỆP VỀ MÁY</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
