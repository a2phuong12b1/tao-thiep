<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Thiệp Tự Động</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        /* PHẦN CSS - LÀM NỀN SANG TRỌNG */
        body {
            margin: 0; padding: 20px; font-family: sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; display: flex; justify-content: center;
        }
        .container {
            background: white; color: #333; padding: 30px;
            border-radius: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;
        }
        input[type="text"] {
            width: 100%; padding: 15px; margin: 15px 0;
            border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box;
        }
        button {
            background: #e94560; color: white; border: none;
            padding: 15px; width: 100%; border-radius: 10px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .img-container { max-height: 400px; overflow: hidden; margin-bottom: 10px; }
        canvas { width: 100%; border-radius: 10px; margin-top: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TẠO THIỆP MỜI</h1>
        <div id="input-area">
            <input type="file" id="imageInput" accept="image/*">
            <div id="cropArea" style="display:none; margin-top: 20px;">
                <div class="img-container"><img id="imageToCrop"></div>
                <button id="cropButton">CẮT ẢNH</button>
            </div>
            <input type="text" id="userName" placeholder="NHẬP HỌ TÊN CỦA BẠN">
            <button id="generateBtn">TẠO THIỆP NGAY</button>
        </div>
        <div id="resultArea" style="display:none;">
            <canvas id="mainCanvas"></canvas>
            <button id="downloadBtn">TẢI THIỆP VỀ MÁY</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        // PHẦN JAVASCRIPT - XỬ LÝ LOGIC
        const imageInput = document.getElementById('imageInput');
        const imageToCrop = document.getElementById('imageToCrop');
        const cropButton = document.getElementById('cropButton');
        const generateBtn = document.getElementById('generateBtn');
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        let cropper, croppedImageDataURL = "";

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imageToCrop.src = event.target.result;
                    document.getElementById('cropArea').style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, { aspectRatio: 1, viewMode: 1 });
                };
                reader.readAsDataURL(file);
            }
        };

        cropButton.onclick = () => {
            croppedImageDataURL = cropper.getCroppedCanvas().toDataURL('image/png');
            document.getElementById('cropArea').style.display = 'none';
            alert("Đã nhận ảnh!");
        };

        generateBtn.onclick = () => {
            const name = document.getElementById('userName').value;
            if (!name || !croppedImageDataURL) return alert("Thiếu tên hoặc ảnh!");
            
            const template = new Image();
            template.crossOrigin = "anonymous";
            template.src = 'phoi-thiep.jpg'; // Đảm bảo file này có trên GitHub

            template.onload = () => {
                mainCanvas.width = template.width;
                mainCanvas.height = template.height;
                ctx.drawImage(template, 0, 0);

                const userImg = new Image();
                userImg.src = croppedImageDataURL;
                userImg.onload = () => {
                    // Bạn cần chỉnh tọa độ x, y, w, h ở đây cho khớp phôi của bạn
                    ctx.drawImage(userImg, 340, 250, 400, 400); 
                    ctx.font = "bold 50px Arial";
                    ctx.fillStyle = "#000000";
                    ctx.textAlign = "center";
                    ctx.fillText(name.toUpperCase(), mainCanvas.width / 2, 850);
                    document.getElementById('resultArea').style.display = 'block';
                };
            };
        };

        document.getElementById('downloadBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'thiep.png';
            link.href = mainCanvas.toDataURL();
            link.click();
        };
    </script>
</body>
</html>
