    <script type="text/javascript">

        const images = document.querySelectorAll('img.no-lazy');
        images.forEach(img => {
            let src = img.getAttribute('data-src');
            img.setAttribute('src', src);
        });

        function onClickBtnPickImg() {
            var inputBtn = document.getElementById("id_file_up");
            inputBtn.click();
        }

        function onClickBtnInputFile() {
            this.value = null;
        }

        function onNameChange() {
            updateCeritifcate();

        function updateCeritifcate() {
            var canvas = document.getElementById("id_main_canvas");
            var ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

                        var sliderXVal = document.getElementById("id_width_pos").value / 100;
            var sliderYVal = (100 - document.getElementById("id_height_pos").value) / 100;
            var sliderZoomVal = document.getElementById("id_zoom").value;
            var expectedWidth = document.getElementById("id_expect_width").value;

            sliderZoomVal = sliderZoomVal / 20 + 0.3;

            let imgAvatar = document.getElementById("id_img_avatar");

            let xPos = canvas.width * sliderXVal, yPos = canvas.height * sliderYVal;
            var scaleFactor = (sliderZoomVal) * ((expectedWidth / 100) * canvas.width) / imgAvatar.width;
            var dispWidth = imgAvatar.width * scaleFactor;
            var dispHeight = imgAvatar.height * scaleFactor;

            if (imgAvatar.complete)
                ctx.drawImage(imgAvatar, xPos - dispWidth / 2, yPos - dispHeight / 2, dispWidth, dispHeight); // Or at whatever offset you like

            
            let imgBackground = document.getElementById("id_img_background");
            if (imgBackground.complete)
                ctx.drawImage(imgBackground, 0, 0, canvas.width, canvas.height); // Or at whatever offset you like

            //text1
                        let xPosText1 = 1368, yPosText1 = 1344;
            ctx.textAlign = "left";
            ctx.fillStyle = "#ffffff";
            ctx.font = "60PX SVN-Gilroy Bold";

            //shadow
                        ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.shadowBlur = 0;
            ctx.shadowColor = "transparent";
            
            ctx.fillText(document.getElementById("id_input_name").value, xPosText1, yPosText1);
            
            //text2
                        //text3
                        //text4
            
            //text5
            
            //text6
            
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.shadowBlur = 0;
            ctx.shadowColor = "transparent";

        }

        function onDownloadClick() {
            var canvas = document.getElementById("id_main_canvas");
            var image = canvas.toDataURL('image/png');

            // create temporary link
            var tmpLink = document.createElement('a');

            let fileName = document.getElementById("id_input_name");
            if(fileName){
                fileName = fileName.value;
            }else{
                fileName = Date.now();
            }

            tmpLink.download = 'KICHHOATHUYET '+fileName+'.png'; // set the name of the download file
            tmpLink.href = image;

            if(checkiphone()){
                // Get all elements with class "example-class"
                const elements = document.querySelectorAll('.img_iphone');

                // Loop through each element and append text
                for (let i = 0; i < elements.length; i++) {
                    const element = elements[i];
                    element.setAttribute('src', image);
                }

                const myElement = document.getElementById('iphone_mess');
                myElement.classList.add('active');

                /*const myElementA = document.getElementById('img_a');
                myElementA.setAttribute('href', image);*/

            }else {
                // temporarily add link to body and initiate the download
                document.body.appendChild(tmpLink);
                tmpLink.click();
                document.body.removeChild(tmpLink);
            }

        }

        function checkiphone(){
            const browserName = navigator.userAgent;

            const substringsIM = ['iPhone', 'Messenger'];
            const containsAllIM = substringsIM.every(substringsIM => browserName.toLowerCase().includes(substringsIM.toLowerCase()));

            const substringsIZ = ['iPhone', 'Zalo'];
            const containsAllIZ = substringsIZ.every(substringsIZ => browserName.toLowerCase().includes(substringsIZ.toLowerCase()));

            return containsAllIM || containsAllIZ;

        }

        function checkandroid(){
            const browserName = navigator.userAgent;

            const substringsAM = ['Android', 'FBAV'];
            const containsAllAM = substringsAM.every(substringsAM => browserName.toLowerCase().includes(substringsAM.toLowerCase()));

            const substringsAZ = ['Android', 'Zalo'];
            const containsAllAZ = substringsAZ.every(substringsAZ => browserName.toLowerCase().includes(substringsAZ.toLowerCase()));

            return containsAllAM;

        }

        function onInputFileChange() {
            input = document.getElementById("id_file_up");
            if (input.files && input.files[0]) {
                var reader = new FileReader();

                reader.onload = function (e) {
                    document.getElementById("id_img_avatar").src = e.target.result;
                };

                reader.readAsDataURL(input.files[0]);
            }
        }

        function onPageLoad() {
            updateCeritifcate();
            if(checkiphone()){
                const myElement = document.getElementById('note_mess');
                myElement.classList.add('active');
            }else if(checkandroid()){
                const myElement = document.getElementById('note_mess_all');
                myElement.classList.add('active');
            }
        }

        setTimeout(function (){
            updateCeritifcate();
        }, 500);

        function onClosePopup(){
            const myElement = document.getElementById('iphone_mess');
            myElement.classList.remove('active');
        }

    </script>
